# پیکربندی electron-builder — ساخت ویجت ویندوزی (exe)
# خروجی‌ها در پوشهٔ release/ ساخته می‌شوند:
#   NetSpeedTray-Setup-x.y.z.exe      (نصب‌شوندهٔ NSIS)
#   NetSpeedTray-Portable-x.y.z.exe   (بدون نیاز به نصب و دسترسی مدیر)

appId: com.raali09.netspeedtray
productName: NetSpeedTray
copyright: Copyright © raali09

directories:
  output: release
  buildResources: build

# فقط لایهٔ الکترون داخل asar بسته می‌شود؛ سرور Next (استandalone)
# به‌صورت «extraResources» با فایل‌های واقعی روی دیسک قرار می‌گیرد
# چون باید با fork اجرا شود.
files:
  - electron/**/*

extraResources:
  # سرور Next یک سطح در «inner» قرار دارد چون electron-builder
  # پوشهٔ node_modules ریشهٔ منبع را همیشه فیلتر می‌کند.
  - from: build/server-bundle
    to: app-server
  - from: build/icon.png
    to: icon.png

asar: true

win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: NetSpeedTray
  artifactName: NetSpeedTray-Setup-${version}.${ext}

portable:
  artifactName: NetSpeedTray-Portable-${version}.${ext}
