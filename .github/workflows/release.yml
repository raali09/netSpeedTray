name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller psutil

      - name: Build executable
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name NetSpeedTray src/netspeedtray.py

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: NetSpeedTray-windows-exe
          path: dist/NetSpeedTray.exe
          if-no-files-found: error

      - name: Attach to GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/NetSpeedTray.exe
          draft: true
          generate_release_notes: true
          name: NetSpeedTray ${{ github.ref_name }}
