name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Read version from VERSION file
        id: version
        shell: bash
        run: |
          # Read VERSION (single line, no surrounding whitespace).
          if [ ! -f VERSION ]; then
            echo "VERSION file not found, falling back to 0.0.0"
            echo "version=0.0.0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          VER="$(tr -d '[:space:]' < VERSION)"
          if [ -z "$VER" ]; then
            VER="0.0.0"
          fi
          echo "version=${VER}" >> "$GITHUB_OUTPUT"
          echo "Building NetSpeedTray v${VER}"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller psutil pillow pytest

      - name: Generate app icon
        run: python make_icon.py

      - name: Run tests
        shell: bash
        continue-on-error: false
        run: |
          # Run the test suite if it exists; skip gracefully otherwise.
          if [ -d tests ]; then
            pytest tests/ -v
          else
            echo "No tests/ directory found, skipping test step."
          fi

      - name: Build executable
        run: |
          echo "Building version ${{ steps.version.outputs.version }}"
          python -m PyInstaller --noconfirm --clean netspeedtray.spec

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: NetSpeedTray-windows-exe
          path: dist/NetSpeedTray.exe
          if-no-files-found: error

      - name: Attach to GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/NetSpeedTray.exe
          draft: true
          generate_release_notes: true
          name: NetSpeedTray v${{ steps.version.outputs.version }}
