name: Release

# Builds NetSpeedTray.exe with PyInstaller on a Windows runner and attaches it
# (plus its SHA-256 checksum) to a draft GitHub release.
#
# Trigger: push a version tag —
#   git tag -a v2.13.0 -m "NetSpeedTray 2.13.0"
#   git push origin main --tags
#
# The tag, the VERSION file and the version embedded into the .exe must all
# agree (the build reads VERSION via netspeedtray.spec).

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-windows:
    name: Build NetSpeedTray.exe (Windows)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade pyinstaller psutil pillow

      - name: Regenerate app icon if missing
        if: ${{ !hashFiles('assets/icon.ico') }}
        run: python make_icon.py

      - name: Build single-file exe (PyInstaller)
        run: python -m PyInstaller --noconfirm --clean netspeedtray.spec

      - name: Verify build output
        shell: pwsh
        run: |
          if (-not (Test-Path 'dist/NetSpeedTray.exe')) {
            Write-Error 'dist/NetSpeedTray.exe was not produced.'
            exit 1
          }
          Get-Item 'dist/NetSpeedTray.exe' | Select-Object Name, Length

      - name: Write SHA-256 checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash -Algorithm SHA256 'dist/NetSpeedTray.exe').Hash.ToLower()
          "$($hash)  NetSpeedTray.exe" | Out-File -FilePath 'dist/NetSpeedTray.exe.sha256' -Encoding ascii
          Get-Content 'dist/NetSpeedTray.exe.sha256'

      - name: Resolve release tag
        id: tag
        shell: bash
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            TAG="$GITHUB_REF_NAME"
          else
            TAG="v$VERSION"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Release tag: $TAG (VERSION file: $VERSION)"

      - name: Remove any stale release of this version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          gh release delete "${{ steps.tag.outputs.tag }}" --yes --cleanup-tag 2>/dev/null || true

      - name: Create draft release with exe attached
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: NetSpeedTray v${{ steps.tag.outputs.version }}
          draft: true
          generate_release_notes: true
          files: |
            dist/NetSpeedTray.exe
            dist/NetSpeedTray.exe.sha256
