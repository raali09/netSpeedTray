# ساخت ویجت ویندوزی (exe) و انتشار خودکار Release — NetSpeedTray
# ------------------------------------------------------------------
# با هر push روی شاخهٔ main/master (یا اجرای دستی از تب Actions):
#   ۱) پروژه روی ویندوز بیلد می‌شود (Next.js standalone + Electron)
#   ۲) فایل‌های NetSpeedTray-Setup-x.y.z.exe و NetSpeedTray-Portable-x.y.z.exe ساخته می‌شوند
#   ۳) یک GitHub Release با شمارهٔ نسخهٔ package.json ساخته و exeها به آن پیوست می‌شوند
# نکته: برای انتشار نسخهٔ جدید فقط کافی است شمارهٔ version را در package.json
# زیاد کنید (و APP_VERSION در src/app/page.tsx) و دوباره push کنید.

name: Build & Release

on:
  push:
    branches: [main, master]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: build-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-windows:
    name: ساخت exe ویندوز
    runs-on: windows-latest

    steps:
      - name: دریافت کد
        uses: actions/checkout@v4

      - name: نصب Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: نصب وابستگی‌ها
        run: npm install --no-audit --no-fund

      - name: ساخت پایگاه‌دادهٔ اولیه
        run: npx prisma db push

      - name: بیلد Next.js (خروجی standalone)
        run: npx next build

      - name: آماده‌سازی بستهٔ سرور داخلی
        run: node scripts/postbuild.mjs

      - name: ساخت exe با electron-builder
        run: npx electron-builder --win --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: خواندن نسخه از package.json
        id: ver
        shell: bash
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: حذف Release و Tag قبلی همین نسخه (در صورت وجود)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete "v${{ steps.ver.outputs.version }}" --yes --cleanup-tag --repo "$GITHUB_REPOSITORY" || true
          git push origin --delete "v${{ steps.ver.outputs.version }}" || true

      - name: ساخت GitHub Release و پیوست فایل exe
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: "NetSpeedTray v${{ steps.ver.outputs.version }}"
          body: |
            NetSpeedTray v${{ steps.ver.outputs.version }} — ویجت دسکتاپی «آزمونگر سرعت اینترنت»

            📦 فایل‌های قابل دانلود:
            - `NetSpeedTray-Setup-${{ steps.ver.outputs.version }}.exe` — نسخهٔ نصب‌شونده
            - `NetSpeedTray-Portable-${{ steps.ver.outputs.version }}.exe` — نسخهٔ پرتیبل (بدون نیاز به نصب و دسترسی مدیر)

            ✨ امکانات:
            - سرعت واقعی دانلود/آپلود بر پایهٔ انتقال واقعی داده (نه برآورد مرورگر)
            - تشخیص صریح قطعی اینترنت — متمایز از «بدون ترافیک»
            - ویجت کوچک همیشه‌بالای صفحه + آیکون در system tray
            - تاریخچهٔ نتایج با ذخیره‌سازی محلی (SQLite)

            🔗 commit: ${{ github.sha }}
          files: |
            release/NetSpeedTray-Setup-*.exe
            release/NetSpeedTray-Portable-*.exe
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: بارگذاری exe به Artifacts (پشتیبان)
        uses: actions/upload-artifact@v4
        with:
          name: NetSpeedTray-Windows-exe
          path: release/*.exe
          if-no-files-found: error
